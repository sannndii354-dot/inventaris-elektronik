services:
  inventaris:
    build: .
    container_name: inventaris-elektronik
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      GDRIVE_REFRESH_TOKEN: ${GDRIVE_REFRESH_TOKEN:-}
      GDRIVE_FOLDER_NAME: ${GDRIVE_FOLDER_NAME:-Inventaris Elektronik Backup}
      GDRIVE_BACKUP_HOURS: ${GDRIVE_BACKUP_HOURS:-24}
      GDRIVE_KEEP: ${GDRIVE_KEEP:-30}
    volumes:
      - inventaris-data:/data

volumes:
  inventaris-data:
